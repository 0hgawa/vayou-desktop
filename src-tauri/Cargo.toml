[package]
name = "vayou-desktop"
version = "0.1.3"
description = "Vayou — Ultra-performant video player"
edition = "2021"

[lib]
name = "vayou_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
flate2 = "1"
tokio = { version = "1", features = ["time", "process"] }
minisign-verify = "0.2"
self-replace = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation"] }

# Quality gate: pedantic + nursery, with the allowances this codebase earns —
# FFI and coordinate math make the cast family noise, and the doc lints do not
# pay for themselves on a single-binary app. Mirrors the Slint sibling's list.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
option_if_let_else = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
type_complexity = "allow"
items_after_statements = "allow"
# Every hit is a #[tauri::command] taking State<'_, T> or AppHandle. The macro
# builds those from the invoke context and hands them over by value — the
# signature is not ours to change.
needless_pass_by_value = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
opt-level = "s"
