name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger (Actions tab → Run workflow) to test a build without
  # cutting a tag — uploads the installer as a workflow artifact.
  workflow_dispatch:

# Required for tauri-action to create the GitHub release and upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # libmpv-2.dll and ffmpeg.exe are not in git (~220 MB combined). CI
      # fetches them from the deps-v1 prerelease before bundling.
      - name: Fetch native binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          gh release download deps-v1 --repo ${{ github.repository }} --pattern 'libmpv-2.dll' --pattern 'ffmpeg.exe' --dir src-tauri/binaries

      - run: pnpm install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a real release when triggered by a tag push;
          # workflow_dispatch just builds and uploads the artifact below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vayou {0}', github.ref_name) || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vayou-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore
